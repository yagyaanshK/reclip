name: Build Cross-Platform Desktop Apps

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            separator: ":"
          - os: macos-latest
            separator: ":"
          - os: windows-latest
            separator: ";"

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Linux GUI Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pillow

    - name: Generate app icons
      run: python make_icons.py

    - name: Generate Windows version resource
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF_NAME}"
        else
          VERSION="0.0.0.0"
        fi
        python make_version_info.py "$VERSION" version_info.txt
        PRODUCT_VERSION=$(grep -o "ProductVersion', '[0-9.]*'" version_info.txt | grep -o '[0-9.]*')
        echo "PRODUCT_VERSION=$PRODUCT_VERSION" >> "$GITHUB_ENV"
        echo "Embedding product version $PRODUCT_VERSION"

    - name: Build Executable with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: >
        pyinstaller --noconfirm --onefile --windowed
        --add-data "templates${{ matrix.separator }}templates"
        --add-data "static${{ matrix.separator }}static"
        --hidden-import=yt_dlp_ejs
        --collect-all yt_dlp_ejs
        --icon "icons/app.ico"
        --version-file "version_info.txt"
        --name "ReClip"
        app.py

    - name: Build Executable with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: >
        pyinstaller --noconfirm --onefile --windowed
        --add-data "templates${{ matrix.separator }}templates"
        --add-data "static${{ matrix.separator }}static"
        --hidden-import=yt_dlp_ejs
        --collect-all yt_dlp_ejs
        --icon "icons/app.icns"
        --name "ReClip"
        app.py

    - name: Build Executable with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: >
        pyinstaller --noconfirm --onefile --windowed
        --add-data "templates${{ matrix.separator }}templates"
        --add-data "static${{ matrix.separator }}static"
        --hidden-import=yt_dlp_ejs
        --collect-all yt_dlp_ejs
        --icon "icons/app.png"
        --name "ReClip"
        app.py

    - name: Create DMG for macOS
      if: matrix.os == 'macos-latest'
      run: |
        npm install -g create-dmg
        create-dmg dist/ReClip.app dist || true
        mv dist/ReClip*.dmg dist/ReClip-macos.dmg || true

    # ── Windows code signing via SignPath Foundation ────────────────────────
    # Runs only for version tags, and only once the repository variables
    # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG
    # plus the secret SIGNPATH_API_TOKEN exist. Until SignPath approves the
    # project these are unset and the unsigned build is published as before.
    - name: Upload unsigned Windows executable for signing
      id: upload-unsigned-exe
      if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
      uses: actions/upload-artifact@v4
      with:
        name: ReClip-windows-unsigned
        path: dist/ReClip.exe
        if-no-files-found: error

    - name: Submit SignPath signing request
      id: signpath
      if: steps.upload-unsigned-exe.outcome == 'success'
      continue-on-error: true
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
        parameters: |
          productVersion: "${{ env.PRODUCT_VERSION }}"
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 3600
        output-artifact-directory: signed

    - name: Use signed executable when available
      if: steps.upload-unsigned-exe.outcome == 'success'
      shell: bash
      run: |
        if [ "${{ steps.signpath.outcome }}" == "success" ] && [ -f signed/ReClip.exe ]; then
          cp -f signed/ReClip.exe dist/ReClip.exe
          echo "::notice title=Code signing::ReClip.exe was signed by SignPath Foundation (request ${{ steps.signpath.outputs.signing-request-web-url }})."
        else
          echo "::warning title=Code signing skipped::SignPath signing failed, timed out, or was not approved. Publishing the UNSIGNED ReClip.exe. Approve or fix the request and re-run this workflow to publish a signed build."
        fi

    - name: Prepare Action Artifacts
      shell: bash
      run: |
        mkdir -p deploy_files
        if [ "$RUNNER_OS" == "Windows" ]; then
          cp dist/ReClip.exe deploy_files/
        elif [ "$RUNNER_OS" == "macOS" ]; then
          cp dist/ReClip-macos.dmg deploy_files/
        else
          cp dist/ReClip deploy_files/
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ReClip-${{ matrix.os }}
        path: deploy_files/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_assets

    - name: Collect release files
      run: |
        mkdir -p final
        cp release_assets/ReClip-windows-latest/ReClip.exe final/
        cp release_assets/ReClip-macos-latest/ReClip-macos.dmg final/
        cp release_assets/ReClip-ubuntu-latest/ReClip final/
        ls -lh final/

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        name: ReClip ${{ github.ref_name }}
        # Desktop releases own the "latest" slot so releases/latest/download/* links keep
        # working. Create CLI/MCP (mcp-v*) releases with `gh release create --latest=false`.
        make_latest: true
        body: |
          Standalone release for Windows, Mac, and Linux. No terminal or Python required!

          ### Downloads
          - 🪟 **Windows:** `ReClip.exe`
          - 🍎 **macOS:** `ReClip-macos.dmg`
          - 🐧 **Linux:** `ReClip`
        files: final/*
        generate_release_notes: true
